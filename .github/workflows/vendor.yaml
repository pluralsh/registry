name: Vendor and Push Images to GHCR

on:
  push:
    paths:
      - vendor.json
  workflow_dispatch:

env:
  CONFIG_FILE: vendor.json
  SCRIPT_FILE: vendor.sh

jobs:
  vendor-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      # Login to GitHub Container Registry using skopeo
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Make script executable
      - name: Prepare script
        run: chmod +x ${{ env.SCRIPT_FILE }}

      # Run vendor script
      - name: Vendor and push images
        run: |
          ./${{ env.SCRIPT_FILE }} "${{ env.CONFIG_FILE }}" "ghcr.io" "${{ github.repository }}"